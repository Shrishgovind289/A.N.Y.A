<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#080c12"
    >

    <title>A.N.Y.A</title>

    <link
        rel="stylesheet"
        href="/static/style.css?v=6"
    >
</head>

<body>
    <div class="app-layout">
        <aside
            id="sidebar"
            class="sidebar"
            aria-label="Projects and chat history"
        >
            <div class="sidebar-header">
                <div class="sidebar-brand">
                    <img
                        src="/static/anya-logo.png"
                        alt="A.N.Y.A logo"
                    >

                    <div>
                        <strong>A.N.Y.A</strong>
                        <span>Workspace</span>
                    </div>
                </div>

                <button
                    id="sidebar-close"
                    class="icon-button sidebar-close"
                    type="button"
                    aria-label="Close sidebar"
                >
                    ×
                </button>
            </div>

            <button
                id="new-project-button"
                class="sidebar-action"
                type="button"
            >
                + New Project
            </button>

            <section class="sidebar-section">
                <div class="sidebar-section-header">
                    <h2>Projects</h2>
                </div>

                <div
                    id="project-list"
                    class="sidebar-list"
                >
                    <button
                        class="sidebar-item active"
                        type="button"
                        data-project-id=""
                    >
                        All Chats
                    </button>
                </div>
            </section>

            <section class="sidebar-section file-section">
                <div class="sidebar-section-header">
                    <h2>Resources</h2>
                </div>

                <div
                    id="project-file-list"
                    class="sidebar-list file-list"
                >
                    <p class="sidebar-empty">
                        Select a project to view resources.
                    </p>
                </div>
            </section>

            <button
                id="new-chat-button"
                class="sidebar-action secondary"
                type="button"
            >
                + New Chat
            </button>

            <section class="sidebar-section chat-section">
                <div class="sidebar-section-header">
                    <h2>Chat History</h2>
                </div>

                <div
                    id="chat-list"
                    class="sidebar-list"
                >
                    <p class="sidebar-empty">
                        No saved chats yet.
                    </p>
                </div>
            </section>
        </aside>

        <button
            id="sidebar-overlay"
            class="sidebar-overlay"
            type="button"
            aria-label="Close sidebar"
        ></button>

        <main class="app-shell">
            <header class="app-header">
                <div class="header-left">
                    <button
                        id="sidebar-toggle"
                        class="icon-button menu-button"
                        type="button"
                        aria-label="Open sidebar"
                    >
                        ☰
                    </button>

                    <div class="brand">
                        <img
                            class="anya-logo"
                            src="/static/anya-logo.png"
                            alt="A.N.Y.A logo"
                        >

                        <div>
                            <h1>A.N.Y.A</h1>

                            <p id="current-project-name">
                                All Chats
                            </p>
                        </div>
                    </div>
                </div>

                <div
                    id="connection-status"
                    class="status-badge offline"
                >
                    Offline
                </div>
            </header>

            <section
                id="messages"
                class="messages"
                aria-live="polite"
            >
                <article class="message assistant-message">
                    <div class="message-label">
                        A.N.Y.A
                    </div>

                    <div class="message-content">
                        Good day, Shrish. Systems are ready.
                    </div>
                </article>
            </section>

            <section class="input-panel">
                <div
                    id="attachment-preview"
                    class="attachment-preview"
                    hidden
                ></div>

                <div class="composer-row">
                    <input
                        id="project-file-input"
                        type="file"
                        multiple
                        hidden
                    >

                    <button
                        id="attach-file-button"
                        class="attach-file-button"
                        type="button"
                        aria-label="Attach files"
                        title="Attach files"
                    >
                        <svg
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                            fill="none"
                            stroke="currentColor"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <path
                                d="M21.44 11.05 12.25 20.24a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"
                            />
                        </svg>
                    </button>

                    <textarea
                        id="message-input"
                        rows="1"
                        maxlength="20000"
                        placeholder="Message A.N.Y.A..."
                        aria-label="Message A.N.Y.A"
                    ></textarea>

                    <button
                        id="send-button"
                        type="button"
                        aria-label="Send message"
                    >
                        Send
                    </button>
                </div>
            </section>
        </main>
    </div>

    <script src="/static/app.js?v=6"></script>
</body>
</html>
